apiVersion: apps/v1
kind: Deployment
metadata:
  name: meme-cointrading-ui
  namespace: production
  labels:
    app: meme-cointrading-ui
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: meme-cointrading-ui
  template:
    metadata:
      labels:
        app: meme-cointrading-ui
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: meme-cointrading-ui
        image: kishore2006/meme-cointrading-ui:v4-prod
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_BACKEND_URL
          value: "https://backend.narrative.trade"
        - name: NEXT_PUBLIC_WEBSOCKET_URL
          value: "https://token-service.narrative.trade"
        - name: NEXT_PUBLIC_IS_BACKEND_DEPLOYED
          value: "true"
        - name: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: walletconnect-project-id
        # KOL leaderboard read path. The wallet-tracker-backend's kolscanPoller
        # is the single writer (runs under PM2 on the wallet-tracker prod VM);
        # this points the Vision page's read at the same Neon DB.
        - name: KOL_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: kol-db
              key: url
        # Disable the in-process refresher in instrumentation.ts — the backend
        # poller already keeps Neon fresh, no need for the Next.js pods to
        # double-fetch kolscan.
        - name: DISABLE_KOL_INPROCESS_CRON
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /.next/cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "node-role.kubernetes.io/system"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: meme-cointrading-ui
  namespace: production
  labels:
    app: meme-cointrading-ui
    monitoring: enabled
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: meme-cointrading-ui
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meme-cointrading-ui-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meme-cointrading-ui
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
