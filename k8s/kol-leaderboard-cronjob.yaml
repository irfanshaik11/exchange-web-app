apiVersion: batch/v1
kind: CronJob
metadata:
  name: kol-leaderboard-refresh
  namespace: staging
spec:
  # Every 30 minutes.
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 180
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.10.1
              args:
                - "-sS"
                - "--fail-with-body"
                - "-X"
                - "POST"
                # In-cluster Service URL. Switch to the public URL if the cron
                # is moved out of the namespace.
                - "http://meme-cointrading-ui.staging.svc.cluster.local:3000/api/cron/refresh-kol-leaderboard"
                - "-H"
                - "Authorization: Bearer $(CRON_SECRET)"
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: kol-leaderboard-cron
                      key: secret
                      optional: true
---
# Create with `kubectl create secret generic kol-leaderboard-cron
#   --from-literal=secret=<your-shared-secret> -n staging`
# and set the same value as CRON_SECRET on the meme-cointrading-ui deployment.
# Leaving the secret absent leaves the endpoint open (fine for private clusters).
