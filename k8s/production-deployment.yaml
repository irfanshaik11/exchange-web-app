apiVersion: apps/v1
kind: Deployment
metadata:
  name: meme-cointrading-ui
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meme-cointrading-ui
  template:
    metadata:
      labels:
        app: meme-cointrading-ui
    spec:
      containers:
        - name: meme-cointrading-ui
          image: kishore2006/meme-cointrading-ui:v4-prod
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_BACKEND_URL
              value: "https://backend.narrative.trade"
            - name: NEXT_PUBLIC_WEBSOCKET_URL
              value: "https://token-service.narrative.trade"
            - name: NEXT_PUBLIC_IS_BACKEND_DEPLOYED
              value: "true"
            - name: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
              value: "f8b3c9d2e1a4b5c6d7e8f9a0b1c2d3e4"  # Replace with your actual WalletConnect Project ID
            # KOL leaderboard read path — points at the same Neon DB the
            # wallet-tracker-backend's kolscanPoller writes to.
            - name: KOL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kol-db
                  key: url
            # Backend poller is the single writer; disable the in-process one.
            - name: DISABLE_KOL_INPROCESS_CRON
              value: "true"
            # Optional Redis cache — degrades silently if secret is absent.
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: kol-redis
                  key: url
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: meme-cointrading-ui
  namespace: production
spec:
  selector:
    app: meme-cointrading-ui
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
