apiVersion: apps/v1
kind: Deployment
metadata:
  name: meme-cointrading-ui
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meme-cointrading-ui
  template:
    metadata:
      labels:
        app: meme-cointrading-ui
    spec:
      containers:
        - name: meme-cointrading-ui
          image: kishore2006/meme-cointrading-ui:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_BACKEND_URL
              value: "https://staging-backend.interstate.so"
            - name: NEXT_PUBLIC_WEBSOCKET_URL
              value: "https://token-staging.interstate.so"
            - name: NEXT_PUBLIC_IS_BACKEND_DEPLOYED
              value: "true"
            - name: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
              value: "f8b3c9d2e1a4b5c6d7e8f9a0b1c2d3e4"  # Replace with your actual WalletConnect Project ID
            - name: DATABASE_URL
              value: "postgresql://postgres:password@postgres:5432/tokenservice"
            # KOL leaderboard read path — points at the same Neon DB the
            # wallet-tracker-backend's kolscanPoller writes to. DATABASE_URL
            # above still serves the tokenservice-shaped routes (/api/tokens,
            # /api/bonding-tokens-search).
            - name: KOL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kol-db
                  key: url
            # Backend poller is the single writer; disable the Next.js
            # in-process refresher to avoid double-fetching kolscan.
            - name: DISABLE_KOL_INPROCESS_CRON
              value: "true"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: meme-cointrading-ui
  namespace: staging
spec:
  selector:
    app: meme-cointrading-ui
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
