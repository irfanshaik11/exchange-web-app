<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Test</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            // Test with the mint address that works
            const mintAddress = '977QtEp7Hx3JH8NXHqjPisCZmW51RkkRrf42QCd2pump';
            const url = `http://localhost:8080/v1/trade/view-by-mint?mint_address=${mintAddress}`;
            
            try {
                console.log('Testing URL:', url);
                const response = await fetch(url);
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                document.getElementById('result').innerHTML = `
                    <h2>Success!</h2>
                    <p><strong>Token Name:</strong> ${data.token.name}</p>
                    <p><strong>Symbol:</strong> ${data.token.symbol}</p>
                    <p><strong>Recent Trades:</strong> ${data.recentTrades.length}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `
                    <h2>Error!</h2>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
