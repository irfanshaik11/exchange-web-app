name: Deploy to Multi-Region MIGs

on:
  push:
    branches: [ prod ]

permissions:
  contents: read
  id-token: write  # Required for OIDC auth

env:
  PROJECT_ID: "interstate-dev"
  WORKLOAD_IDENTITY_PROVIDER: "projects/486942555299/locations/global/workloadIdentityPools/github-cicd-pool/providers/github"
  SERVICE_ACCOUNT: "github-cicd@interstate-dev.iam.gserviceaccount.com"
  STARTUP_SCRIPT: "deployment/startup-script/interstate-narrative-frontend-prod-startup.sh"

  # List of MIGs with their zones (MIG:ZONE)
  MIG_LIST: >
    interstate-narrative-frontend-prod-frankfurt:europe-west3-a
    interstate-narrative-frontend-prod-tokyo:asia-northeast1-a
    interstate-narrative-frontend-prod-us-east:us-east4-a
    interstate-narrative-frontend-prod-us-west:us-west1-a

jobs:
  Deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Authenticate via OIDC
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      # Step 3 — Setup gcloud
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Step 4 — Create GLOBAL Instance Template
      - name: Create Global Instance Template
        run: |
          TEMPLATE_NAME="interstate-narrative-frontend-prod-${GITHUB_SHA::8}"
          echo "Creating GLOBAL template: $TEMPLATE_NAME"

          gcloud compute instance-templates create $TEMPLATE_NAME \
            --project=$PROJECT_ID \
            --machine-type=n2-standard-2 \
            --network-interface=network=interstate-narrative-vpc-global,network-tier=PREMIUM,stack-type=IPV4_ONLY,no-address \
            --maintenance-policy=MIGRATE \
            --provisioning-model=STANDARD \
            --service-account=486942555299-compute@developer.gserviceaccount.com \
            --scopes=https://www.googleapis.com/auth/devstorage.read_only,https://www.googleapis.com/auth/logging.write,https://www.googleapis.com/auth/monitoring.write,https://www.googleapis.com/auth/service.management.readonly,https://www.googleapis.com/auth/servicecontrol,https://www.googleapis.com/auth/trace.append \
            --tags=lb-health-check \
            --create-disk=auto-delete=yes,boot=yes,device-name=$TEMPLATE_NAME,image=projects/interstate-dev/global/images/interstate-narrative-frontend-prod-image-17112025,mode=rw,size=150,type=pd-ssd \
            --no-shielded-secure-boot \
            --shielded-vtpm \
            --shielded-integrity-monitoring \
            --reservation-affinity=any \
            --metadata-from-file=startup-script=$STARTUP_SCRIPT

          echo "TEMPLATE_NAME=$TEMPLATE_NAME" >> $GITHUB_ENV

      # Step 5 — Rolling Update Across ALL MIGs
      - name: Rolling update MIGs across all regions
        run: |
          echo "Updating all multi-region MIGs using template $TEMPLATE_NAME"

          for ENTRY in $MIG_LIST; do
            IFS=":" read MIG ZONE <<< "$ENTRY"
            echo "Starting rolling update for MIG: $MIG in zone: $ZONE"

            gcloud compute instance-groups managed rolling-action start-update $MIG \
              --version template=projects/${PROJECT_ID}/global/instanceTemplates/${TEMPLATE_NAME} \
              --zone=$ZONE

            echo "Triggered update for: $MIG"
          done

          echo "Multi-region rolling update initiated successfully."